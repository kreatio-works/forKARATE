<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>forKARATE ─ 空手道場向け無料ツール集</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --paper: #fafaf7;
    --ink: #1f2933;
    --line: #cfd6dc;
    --grid: #eceff1;
    --blue: #2b5d8a;
    --radius: 4px;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  header {
    background: #fff;
    border-bottom: 2px solid var(--ink);
    padding: 10px 14px 8px;
  }
  header h1 { max-width: 720px; margin: 0 auto; font-size: 1.1rem; letter-spacing: .12em; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 14px; }
  .lead { font-size: .85rem; color: #5a6572; margin: 0 0 16px; }
  a.tool {
    display: block; background: #fff;
    border: 1px solid var(--line); border-left: 4px solid var(--blue);
    border-radius: var(--radius); padding: 12px 14px; margin: 10px 0;
    color: inherit; text-decoration: none;
  }
  a.tool:hover { outline: 2px solid var(--blue); outline-offset: -2px; }
  a.tool .name { font-weight: 700; }
  a.tool .desc { font-size: .8rem; color: #5a6572; margin-top: 2px; }
  footer { margin: 28px 0 8px; text-align: center; font-size: .72rem; color: #5a6572; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header><h1>forKARATE</h1></header>
<main>
  <p class="lead">空手道場の運営に役立つ無料ツール集です。インストール不要・ブラウザで開くだけ。入力した情報はすべて端末内にのみ保存されます。</p>
  <a class="tool" href="calendar-maker/">
    <div class="name">練習日程表メーカー</div>
    <div class="desc">月間練習日程表を作って、A4横1枚のExcelファイル（.xlsx）として出力</div>
  </a>
  <footer>MIT License ／ <a href="https://kreatio-works.github.io/">kreatio-works</a></footer>
</main>
</body>
</html>
